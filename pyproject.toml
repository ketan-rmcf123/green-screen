[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "greenscreen-studio"
version = "2.0.0"
description = "Modern AI & Chroma-Key Virtual Background Studio with Real-Time Compositing"
authors = [{ name = "Ketan", email = "ketanpalankar123@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.22.0",
    "pillow>=10.0.0",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
ai = [
    "mediapipe>=0.10.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
greenscreen = "greenscreen.cli:main"
